name: Git Town

on:
  pull_request:
    branches:
      - '**'

jobs:
  git-town:
    name: Display the branch stack
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: git-town/action@8a6469b6e49b1d8c8eac1daf542ce05fac587308
        with:
          skip-single-stacks: true
          main-branch: main
