name: Git Town

on:
  pull_request:
    branches:
      - '**'

jobs:
  git-town:
    name: Display the branch stack
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: git-town/action@db5a46a8e5fa44f2f69c07ecc3e1e2580ca9ba56
        with:
          skip-single-stacks: true
          main-branch: main
